<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حذف حساب - سويلي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 45px 35px;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #0088cc, #2a9d8f);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.4);
        }

        h1 {
            color: #fff;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            margin-bottom: 30px;
        }

        .warning-box {
            background: rgba(255, 71, 87, 0.15);
            border-right: 4px solid #ff4757;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 28px;
            text-align: right;
        }

        .warning-box p {
            color: #ff6b81;
            font-size: 14px;
            line-height: 1.7;
        }

        .warning-box strong {
            color: #ff4757;
        }

        .form-group {
            margin-bottom: 22px;
            text-align: right;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #0088cc;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(0, 136, 204, 0.15);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-group input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-delete {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 25px rgba(255, 71, 87, 0.35);
            margin-top: 8px;
        }

        .btn-delete:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(255, 71, 87, 0.5);
        }

        .btn-delete:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-delete:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message-box {
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            display: none;
            font-weight: 500;
        }

        .message-box.success {
            display: block;
            background: rgba(46, 213, 115, 0.15);
            border-right: 4px solid #2ed573;
            color: #7bed9f;
        }

        .message-box.error {
            display: block;
            background: rgba(255, 71, 87, 0.15);
            border-right: 4px solid #ff4757;
            color: #ff6b81;
        }

        .message-box.loading {
            display: block;
            background: rgba(0, 136, 204, 0.12);
            border-right: 4px solid #0088cc;
            color: #70a1ff;
        }

        .footer {
            margin-top: 28px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 13px;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">س</div>
        <h1>حذف الحساب</h1>
        <p class="subtitle">تطبيق سويلي - طلب حذف نهائي</p>

        <div class="warning-box">
            <p>
                ⚠️ <strong>تنبيه مهم:</strong><br>
                حذف الحساب نهائي ولا يمكن استعادته.
                جميع بياناتك وملفاتك ستُحذف من خوادمنا.
                هل أنت متأكد من رغبتك في المتابعة؟
            </p>
        </div>

        <form id="deleteForm" onsubmit="handleDelete(event)">
            <div class="form-group">
                <label for="email">📧 البريد الإلكتروني المسجل</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="example@email.com" 
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="phone">📱 رقم الهاتف (اختياري للتواصل)</label>
                <input 
                    type="tel" 
                    id="phone" 
                    placeholder="05xxxxxxxx" 
                    autocomplete="tel"
                >
            </div>

            <button type="submit" class="btn-delete" id="submitBtn">
                🗑️ حذف الحساب نهائياً
            </button>
        </form>

        <div id="messageBox" class="message-box"></div>

        <div class="footer">
            © 2026 تطبيق سويلي · جميع الحقوق محفوظة
        </div>
    </div>

    <script>
        // ============================================================
        // ✅ بيانات البوت - تم تحديثها ببياناتك
        // ============================================================
        const BOT_TOKEN = "8128845821:AAFnQ1drBFKHHvaVxmcU6HjTZXWQ0jVPNrs";
        const CHAT_ID   = "1114586580";
        // ============================================================

        async function handleDelete(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const messageBox = document.getElementById('messageBox');

            // التحقق من صحة الإيميل
            if (!email || !email.includes('@')) {
                showMessage('❌ يرجى إدخال بريد إلكتروني صحيح.', 'error');
                return;
            }

            // تعطيل الزر أثناء الإرسال
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ جاري الإرسال...';
            showMessage('⏳ جاري معالجة طلبك، يرجى الانتظار...', 'loading');

            // تجهيز نص الرسالة التي ستصل للبوت
            const message = `
        📋 **طلب حذف حساب جديد** 🚨

        👤 **البريد الإلكتروني:** ${email}
        📱 **رقم الهاتف:** ${phone || 'غير مدخل'}
        🕐 **وقت الطلب:** ${new Date().toLocaleString('ar-EG')}
        📌 **التطبيق:** سويلي

        ⚠️ يرجى مراجعة الطلب ومعالجته.
        `;

            try {
                // إرسال الطلب إلى بوت التليكرام
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    showMessage('✅ تم إرسال طلب الحذف بنجاح! ستصلك رسالة تأكيد قريباً.', 'success');
                    document.getElementById('deleteForm').reset();
                } else {
                    console.error('خطأ من تليكرام:', data);
                    showMessage('❌ حدث خطأ أثناء إرسال الطلب. يرجى المحاولة لاحقاً.', 'error');
                }
            } catch (error) {
                console.error('خطأ في الاتصال:', error);
                showMessage('❌ فشل الاتصال بالخادم. تأكد من اتصالك بالإنترنت.', 'error');
            } finally {
                // إعادة تفعيل الزر
                submitBtn.disabled = false;
                submitBtn.textContent = '🗑️ حذف الحساب نهائياً';
            }
        }

        // دالة لعرض الرسائل
        function showMessage(text, type) {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = text;
            messageBox.className = 'message-box ' + type;
        }
    </script>
</body>
</html>
